apiVersion: v1
kind: Pod
metadata:
  namespace: jenkins-agents
  labels:
    app.kubernetes.io/part-of: taskflow-lab10
spec:
  serviceAccountName: jenkins-agent
  automountServiceAccountToken: false
  restartPolicy: Never
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: flutter
      image: cirruslabs/flutter:stable
      command: ["bash", "-lc", "cat"]
      tty: true
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: 500m
          memory: 1Gi
        limits:
          cpu: "2"
          memory: 3Gi
    - name: osv-scanner
      image: ghcr.io/google/osv-scanner:v2.6.0
      command: ["/bin/sh", "-c", "sleep infinity"]
      tty: true
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: "1"
          memory: 512Mi
